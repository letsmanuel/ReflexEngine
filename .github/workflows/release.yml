name: Release

# Push a tag like v0.1.0 to build the Windows demo, the engine DLL and a source zip.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build demo and run tests (static engine)
        run: |
          cmake -S . -B build-demo -DCMAKE_BUILD_TYPE=Release -DREFLEX_BUILD_TESTS=ON -DREFLEX_BUILD_DEMO=ON
          cmake --build build-demo --config Release --parallel
          ctest --test-dir build-demo --build-config Release --output-on-failure
      - name: Build engine as DLL
        run: |
          cmake -S . -B build-lib -DCMAKE_BUILD_TYPE=Release -DREFLEX_BUILD_SHARED=ON -DREFLEX_BUILD_TESTS=OFF -DREFLEX_BUILD_DEMO=OFF
          cmake --build build-lib --config Release --parallel
      - name: Package
        shell: bash
        run: |
          mkdir -p pkg/demo pkg/engine/include
          cp -r include/reflex pkg/engine/include/
          cp LICENSE README.md THIRD_PARTY_LICENSES.md pkg/engine/
          cp build-demo/demo/Release/reflex_demo.exe pkg/demo/
          cp build-lib/src/Release/reflex.dll build-lib/src/Release/reflex.lib pkg/engine/
          git archive --format=zip --prefix=ReflexEngine-${GITHUB_REF_NAME}/ -o ReflexEngine-source-${GITHUB_REF_NAME}.zip HEAD
          cd pkg && 7z a -tzip ../ReflexEngine-windows-${GITHUB_REF_NAME}.zip demo engine
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ReflexEngine-windows-*.zip
            ReflexEngine-source-*.zip
